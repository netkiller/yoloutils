<header>
  <div class="brand-title">
    <a class="header-home-link" href="https://saas.netkiller.cn" target="_blank" rel="noopener noreferrer" title="Home" aria-label="Home">
      <svg class="header-home-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 11.5 12 4l9 7.5"></path>
        <path d="M5.5 10.5V20h13v-9.5"></path>
        <path d="M9.5 20v-6h5v6"></path>
      </svg>
    </a>
    {% if username %}
      <span class="user-avatar" style="--user-color: {{ username_color | default('#3b82f6') }}" aria-hidden="true">{{ username_initial | default(username[:1]) }}</span>
      <span class="username-badge">{{ username }}</span>
      <form class="logout-form" method="post" action="/team/logout">
        <button type="submit">注销</button>
      </form>
      {% if current_project %}
        <a class="close-current-project" href="/project" title="关闭当前项目"><span class="nav-icon">×</span><span>关闭项目</span></a>
      {% endif %}
    {% else %}
      <strong>Yolo Workstation</strong>
    {% endif %}
  </div>
  <nav aria-label="主导航">
    {% if is_team_mode %}
    <a{% if active_page == "team" %} class="active"{% endif %} href="/team{% if current_project %}/{{ current_project }}{% endif %}"><span class="nav-icon">◌</span><span>团队</span></a>
    {% endif %}
    <a{% if active_page == "project" %} class="active"{% endif %} href="{% if current_project %}/project/{{ current_project }}{% else %}/project{% endif %}"><span class="nav-icon">▤</span><span>项目</span></a>
    <a{% if active_page == "resources" %} class="active"{% endif %} href="{% if current_project %}/resources/{{ current_project }}{% else %}/resources{% endif %}"><span class="nav-icon">▥</span><span>算力</span></a>
    {% if current_project %}
      <a{% if active_page == "annotate" %} class="active"{% endif %} href="/annotate/{{ current_project }}"><span class="nav-icon">▧</span><span>标注</span></a>
      <a{% if active_page == "dataset" %} class="active"{% endif %} href="/dataset{% if current_project %}/{{ current_project }}{% endif %}"><span class="nav-icon">▦</span><span>数据集</span></a>
      <a{% if active_page == "model" %} class="active"{% endif %} href="/model/{{ current_project }}"><span class="nav-icon">◎</span><span>模型</span></a>
    {% endif %}
  </nav>
  <div class="header-actions">
    {% if is_team_mode %}
      <button class="public-header-button" type="button" data-public-share data-share-url="{{ share_url }}" title="分享工作站地址"><span class="nav-icon">⇪</span><span>分享</span></button>
    {% endif %}
  </div>
</header>
<script>
  (() => {
    const share = document.querySelector("[data-public-share]");
    share?.addEventListener("click", async () => {
      const url = share.dataset.shareUrl || location.href;
      const payload = {title: document.title || "Yolo Workstation", text: url, url};
      try {
        if (navigator.share) {
          await navigator.share(payload);
          return;
        }
        await navigator.clipboard.writeText(url);
        alert("已复制工作站地址");
      } catch (error) {
        if (navigator.clipboard) {
          await navigator.clipboard.writeText(url);
          alert("已复制工作站地址");
        }
      }
    });
  })();
</script>
