<header>
  <div class="brand-title">
    {% if username %}
      <span class="user-avatar" style="--user-color: {{ username_color | default('#3b82f6') }}" aria-hidden="true">{{ username_initial | default(username[:1]) }}</span>
      <span class="username-badge">{{ username }}</span>
      <form class="logout-form" method="post" action="/team/logout">
        <button type="submit">注销</button>
      </form>
      {% if current_project %}
        <a class="close-current-project" href="/project" title="关闭当前项目"><span class="nav-icon">×</span><span>关闭项目</span></a>
      {% endif %}
    {% else %}
      <strong>Yolo Workstation</strong>
    {% endif %}
  </div>
  <nav aria-label="主导航">
    <a{% if active_page == "team" %} class="active"{% endif %} href="/team{% if current_project %}?project={{ current_project }}{% endif %}"><span class="nav-icon">◌</span><span>团队</span></a>
    <a{% if active_page == "project" %} class="active"{% endif %} href="{% if current_project %}/project/{{ current_project }}{% else %}/project{% endif %}"><span class="nav-icon">▤</span><span>项目</span></a>
    {% if current_project %}
      <a{% if active_page == "annotate" %} class="active"{% endif %} href="/annotate/?project={{ current_project }}"><span class="nav-icon">▧</span><span>标注</span></a>
      <a{% if active_page == "dataset" %} class="active"{% endif %} href="/dataset?project={{ current_project }}"><span class="nav-icon">▦</span><span>数据集</span></a>
      <a{% if active_page == "train" %} class="active"{% endif %} href="/train?project={{ current_project }}"><span class="nav-icon">▶</span><span>训练</span></a>
      <a{% if active_page == "validate" %} class="active"{% endif %} href="/validate?project={{ current_project }}"><span class="nav-icon">✓</span><span>验证</span></a>
    {% endif %}
  </nav>
  <div class="header-actions">
    {% if is_team_mode %}
      <button class="public-header-button" type="button" data-public-share data-share-url="{{ share_url }}" title="分享工作站地址"><span class="nav-icon">⇪</span><span>分享</span></button>
    {% endif %}
  </div>
</header>
<script>
  (() => {
    const share = document.querySelector("[data-public-share]");
    share?.addEventListener("click", async () => {
      const url = share.dataset.shareUrl || location.href;
      const payload = {title: document.title || "Yolo Workstation", text: url, url};
      try {
        if (navigator.share) {
          await navigator.share(payload);
          return;
        }
        await navigator.clipboard.writeText(url);
        alert("已复制工作站地址");
      } catch (error) {
        if (navigator.clipboard) {
          await navigator.clipboard.writeText(url);
          alert("已复制工作站地址");
        }
      }
    });
  })();
</script>
