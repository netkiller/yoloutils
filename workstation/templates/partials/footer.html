<footer{% if footer_id %} id="{{ footer_id }}"{% endif %} class="site-footer{% if footer_class %} {{ footer_class }}{% endif %}">
  <div class="stats-left">
    {% if footer_left %}
      <span class="footer-text">{{ footer_left }}</span>
    {% endif %}
  </div>
  <div class="stats-right">
    {% if footer_right %}{{ footer_right }}{% endif %}
    <button class="footer-button" type="button" data-public-shortcuts title="查看快捷键"><span class="footer-button-icon">⌘</span>快捷键</button>
    <button class="footer-button" type="button" data-footer-console-toggle><span class="footer-button-icon">▤</span>控制台</button>
    <a class="footer-button" href="/help" data-public-help title="帮助（⌘H）"><span class="footer-button-icon">?</span>帮助</a>
  </div>
</footer>
<div class="public-shortcut-popover" data-public-shortcut-popover hidden>
  <div class="public-shortcut-title">
    <span>快捷键</span>
    <button type="button" data-close-public-shortcuts aria-label="关闭">×</button>
  </div>
  <div class="public-shortcut-list">
    <span>↑ / ↓</span><span>在目录树中切换目录</span>
    <span>← / →</span><span>切换上一张 / 下一张图片</span>
    <span>⌘M</span><span>切换 box 半透明遮罩</span>
    <span>⌘S</span><span>保存当前标注</span>
    <span>⌘D</span><span>删除当前标注</span>
    <span>DEL</span><span>删除选中的 box</span>
    <span>⌘R</span><span>重置当前操作</span>
    <span>⌘～ / ⌘` / ⌘0-9</span><span>选择对应索引的标签</span>
    <span>ESC</span><span>还原图片缩放 / 关闭快捷键窗口</span>
    <span>滚轮</span><span>快速放大或缩小图片</span>
    <span>双击图像标题</span><span>隐藏或显示左右栏</span>
  </div>
</div>
<section class="footer-console" data-footer-console{% if footer_console_url %} data-footer-console-url="{{ footer_console_url }}"{% endif %} hidden>
  <div class="footer-console-resizer" data-footer-console-resizer title="拖动调整控制台高度" aria-hidden="true"></div>
  <pre>控制台暂无输出</pre>
</section>
<script>
  (() => {
    const shortcuts = document.querySelector("[data-public-shortcuts]");
    const popover = document.querySelector("[data-public-shortcut-popover]");
    const close = document.querySelector("[data-close-public-shortcuts]");
    const help = document.querySelector("[data-public-help]");
    function toggleShortcuts(forceOpen) {
      if (!popover) return;
      popover.hidden = typeof forceOpen === "boolean" ? !forceOpen : !popover.hidden;
    }
    shortcuts?.addEventListener("click", () => toggleShortcuts());
    close?.addEventListener("click", () => {
      if (popover) popover.hidden = true;
    });
    help?.addEventListener("click", (event) => {
      event.preventDefault();
      window.location.assign(help.getAttribute("href") || "/help");
    });
    window.addEventListener("keydown", (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "h") {
        event.preventDefault();
        window.location.assign("/help");
        return;
      }
      if (event.key === "Escape" && popover && !popover.hidden) popover.hidden = true;
    });
  })();
  (() => {
    const toggle = document.querySelector("[data-footer-console-toggle]");
    const panel = document.querySelector("[data-footer-console]");
    const output = panel?.querySelector("pre");
    const resizer = panel?.querySelector("[data-footer-console-resizer]");
    const minHeight = 120;
    const maxHeight = () => Math.max(180, Math.floor(window.innerHeight * 0.72));
    function setConsoleHeight(height) {
      const nextHeight = Math.max(minHeight, Math.min(maxHeight(), Math.round(height)));
      document.documentElement.style.setProperty("--public-console-height", `${nextHeight}px`);
    }
    async function loadConsole() {
      if (!panel || !output || !panel.dataset.footerConsoleUrl) {
        return;
      }
      output.textContent = "正在读取控制台日志...";
      try {
        const response = await fetch(panel.dataset.footerConsoleUrl, {cache: "no-store"});
        const data = await response.json();
        if (!response.ok || !data.ok) {
          output.textContent = data.error || "控制台日志读取失败";
          return;
        }
        const lines = data.lines || [];
        output.textContent = lines.length
          ? [`日志文件：${data.file}`, "", ...lines].join("\n")
          : `日志文件：${data.file}\n\n暂无上传日志`;
      } catch (error) {
        output.textContent = "控制台日志读取失败";
      }
    }
    window.yoloutilsReloadFooterConsole = loadConsole;
    toggle?.addEventListener("click", (event) => {
      if (!panel) return;
      const open = panel.hasAttribute("hidden");
      panel.toggleAttribute("hidden", !open);
      document.body.classList.toggle("public-console-open", open);
      event.currentTarget.classList.toggle("active", open);
      if (open) loadConsole();
    });
    function startConsoleResize(clientY, event) {
      if (!panel || panel.hidden || clientY == null) return;
      event.preventDefault();
      const startY = clientY;
      const startHeight = panel.getBoundingClientRect().height;
      document.body.classList.add("public-console-resizing");
      function moveFromClientY(nextY) {
        if (nextY != null) setConsoleHeight(startHeight + startY - nextY);
      }
      function onPointerMove(moveEvent) {
        moveFromClientY(moveEvent.clientY);
      }
      function onMouseMove(moveEvent) {
        moveFromClientY(moveEvent.clientY);
      }
      function onTouchMove(moveEvent) {
        moveFromClientY(moveEvent.touches?.[0]?.clientY);
      }
      function onUp() {
        document.body.classList.remove("public-console-resizing");
        window.removeEventListener("pointermove", onPointerMove);
        window.removeEventListener("pointerup", onUp);
        window.removeEventListener("mousemove", onMouseMove);
        window.removeEventListener("mouseup", onUp);
        window.removeEventListener("touchmove", onTouchMove);
        window.removeEventListener("touchend", onUp);
      }
      window.addEventListener("pointermove", onPointerMove);
      window.addEventListener("pointerup", onUp, {once: true});
      window.addEventListener("mousemove", onMouseMove);
      window.addEventListener("mouseup", onUp, {once: true});
      window.addEventListener("touchmove", onTouchMove, {passive: false});
      window.addEventListener("touchend", onUp, {once: true});
    }
    resizer?.addEventListener("pointerdown", (event) => {
      resizer.setPointerCapture?.(event.pointerId);
      startConsoleResize(event.clientY, event);
    });
    resizer?.addEventListener("mousedown", (event) => {
      startConsoleResize(event.clientY, event);
    });
    resizer?.addEventListener("touchstart", (event) => {
      startConsoleResize(event.touches?.[0]?.clientY, event);
    });
  })();
</script>
