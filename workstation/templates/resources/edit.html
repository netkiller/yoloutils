{% extends "base.html" %}

{% block title %}编辑算力中心 {{ resource.name }}{% endblock %}

{% block content %}
  <main class="resources-main">
    <section class="toolbar" aria-labelledby="resource-edit-title">
      <div>
        <h1 id="resource-edit-title">编辑算力中心</h1>
        <p class="project-description muted">{{ resource.address }}</p>
      </div>
      <a class="resource-back-link" href="{{ resources_base }}/server/{{ resource.id }}">返回详情</a>
    </section>

    <form class="resource-card resource-form resource-edit-form" method="post" action="{{ resources_base }}/server/{{ resource.id }}/edit">
      <div class="resource-card-head">
        <span class="resource-card-icon">✎</span>
        <div>
          <h2>{{ resource.name }}</h2>
          <p>修改 SSH 连接信息。</p>
        </div>
      </div>
      <label>
        <span>名称</span>
        <input name="name" type="text" value="{{ resource.name }}" required>
      </label>
      <div class="resource-form-row">
        <label>
          <span>主机</span>
          <input name="host" type="text" value="{{ resource.host }}" required>
        </label>
        <label>
          <span>端口</span>
          <input name="port" type="number" min="1" max="65535" value="{{ resource.port }}" required>
        </label>
      </div>
      <div class="resource-form-row">
        <label>
          <span>用户名</span>
          <input name="username" type="text" value="{{ resource.username }}" required>
        </label>
      </div>
      <label>
        <span>密码</span>
        <input name="password" type="password" autocomplete="new-password" value="{{ resource.password }}" required>
      </label>
      <label>
        <span>备注</span>
        <textarea name="note" rows="4">{{ resource.note }}</textarea>
      </label>
      <button type="submit">保存修改</button>
    </form>
  </main>

  {% set footer_id = "stats" %}
  {% set footer_left = workspace %}
  {% include "partials/footer.html" %}
{% endblock %}
