{% extends "base.html" %}

{% block title %}新建训练{% endblock %}

{% block styles %}
  <link rel="stylesheet" href="/static/css/train.css?v=20260504-train-options">
{% endblock %}

{% block content %}
  <main>
    <dialog class="train-dialog" open>
      <form method="post" action="/train">
        <div class="dialog-head">
          <h1>新建训练任务</h1>
          <a href="/dataset" aria-label="关闭">×</a>
        </div>

        <label>
          <span>任务名称</span>
          <input name="name" type="text" value="{{ dataset.name if dataset else 'train' }}" required>
        </label>

        <label>
          <span>数据集</span>
          <select name="dataset" required>
            {% for item in datasets %}
              <option value="{{ item.name }}" {% if dataset and item.path == dataset.path %}selected{% endif %}>{{ item.project }} / {{ item.name }}</option>
            {% endfor %}
          </select>
        </label>
        <input type="hidden" name="project" value="{{ dataset.project if dataset else '' }}">

        <label>
          <span>项目名称</span>
          <input class="readonly-field" type="text" value="{{ dataset.project if dataset else current_project }}" readonly>
        </label>

        <div class="form-grid">
          <label>
            <span>模型</span>
            <select name="model_version" required>
              {% for version in model_versions %}
                <option value="{{ version }}" {% if version == default_model_version %}selected{% endif %}>{{ version }}</option>
              {% endfor %}
            </select>
          </label>
          <label>
            <span>模型尺寸</span>
            <select name="model_size" required>
              {% for size in model_sizes %}
                <option value="{{ size }}" {% if size == default_model_size %}selected{% endif %}>{{ size }}</option>
              {% endfor %}
            </select>
          </label>
          <label>
            <span>轮数</span>
            <input name="epochs" type="number" min="1" value="200" required>
          </label>
        </div>

        <section class="optional-params" aria-label="可选参数">
          <h2>可选参数</h2>
          <div class="form-grid">
            <label>
              <span>batch</span>
              <input name="batch" type="number" min="1" placeholder="自动">
            </label>
            <label>
              <span>device</span>
              <input name="device" type="text" placeholder="cpu / 0 / 0,1">
            </label>
            <label>
              <span>workers</span>
              <input name="workers" type="number" min="0" placeholder="自动">
            </label>
            <label>
              <span>amp</span>
              <select name="amp">
                <option value="">自动</option>
                <option value="true">true</option>
                <option value="false">false</option>
              </select>
            </label>
            <label>
              <span>imgsz</span>
              <input name="imgsz" type="number" min="32" step="32" placeholder="自动">
            </label>
            <label>
              <span>data</span>
              <input name="data" type="text" placeholder="留空自动生成 data.yaml">
            </label>
          </div>
        </section>

        <div class="dialog-actions">
          <a class="secondary-link" href="/dataset">放弃</a>
          <button type="submit">开始</button>
        </div>
      </form>
    </dialog>
  </main>

  {% set footer_id = "stats" %}
  {% set footer_left = workspace %}
  {% include "partials/footer.html" %}
{% endblock %}
